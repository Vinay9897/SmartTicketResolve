spring.application.name=smartresolve

# PostgreSQL
spring.datasource.url=${SMARTRESOLVE_DB_URL:jdbc:postgresql://localhost:5432/smartresolve}
spring.datasource.username=${SMARTRESOLVE_DB_USERNAME:postgres}
spring.datasource.password=${SMARTRESOLVE_DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Persistence and schema migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT secret must be supplied through the environment and contain at least 32 characters.
smartresolve.security.jwt.secret=${SMARTRESOLVE_JWT_SECRET}
smartresolve.security.jwt.access-token-ttl=PT15M

# API documentation and health checks
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.hcl.smart.ticket=INFO
logging.level.org.springframework.security=INFO
logging.file.name=logs/smartresolve.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
