spring.datasource.url=jdbc:h2:mem:smartresolve;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__create_smartresolve_schema.sql,classpath:db/migration/V2__update_support_engineer_role.sql
logging.file.name=
smartresolve.security.jwt.secret=test-only-secret-with-more-than-thirty-two-bytes-for-hs256-signing
smartresolve.security.jwt.access-token-ttl=PT15M
